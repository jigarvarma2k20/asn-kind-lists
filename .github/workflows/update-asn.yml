name: Update ASN Lists

on:
  schedule:
    - cron: "0 1 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: update-asn-lists
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.x"
          cache: false

      - name: Build ASN kind lists tool
        run: go build -o main main.go

      - name: Fetch and classify ASNs
        env:
          INTERNETDATA_APIKEY: ${{ secrets.INTERNETDATA_APIKEY }}
        run: ./main

      - name: Commit updated lists
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (
            git commit -m "Update ASN lists" &&
            git push
          )